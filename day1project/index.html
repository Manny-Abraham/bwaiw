<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BWAIW Study Planner — Past Questions to N-Day Plan</title>
<link rel="stylesheet" href="styles.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<header>
  <h1>Past Questions → Study Plan</h1>
  <p class="sub">WAEC / NECO / JAMB · Math + English · 100% offline after load</p>
  <div id="progressWrap" hidden>
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="progressText"></div>
  </div>
</header>

<main>
  <!-- VIEW 1: Setup -->
  <section id="view-setup" class="card">
    <h2>1. Setup</h2>
    <div class="row">
      <label><input type="checkbox" id="subMath" checked /> Mathematics</label>
      <label><input type="checkbox" id="subEng" checked /> English</label>
    </div>
    <div class="grid2">
      <label>N days (1–90)<input type="number" id="inDays" value="14" min="1" max="90" /></label>
      <label>Hours per day (1–8)<input type="number" id="inHours" value="2" min="1" max="8" /></label>
    </div>
    <label>Exam date (optional)<input type="date" id="inExam" /></label>
    <label>Paste past questions (optional)<textarea id="inPaste" rows="4" placeholder="Paste WAEC questions here, one per line. They will be auto-tagged to topics."></textarea></label>
    <label>Or load .txt / PDF-text file<input type="file" id="inFile" accept=".txt,.pdf" /></label>
    <p class="hint">V1 supports pasted text + PDF text. Photo / image OCR coming soon.</p>
    <button id="btnGenerate">Generate N-day plan</button>
    <button id="btnSample" class="ghost" type="button">Use sample instead</button>
  </section>

  <!-- VIEW 2: Plan -->
  <section id="view-plan" class="card" hidden>
    <h2>2. Your <span id="planN"></span>-day plan</h2>
    <div class="toolbar">
      <button id="btnToday">Today focus</button>
      <button id="btnRebalance" class="ghost">Rebalance missed days</button>
      <button id="btnReset" class="ghost">Start over</button>
    </div>
    <div id="planGrid"></div>
  </section>

  <!-- VIEW 3: Today -->
  <section id="view-today" class="card" hidden>
    <h2>3. Today focus</h2>
    <div id="todayBody"></div>
    <button id="btnBack" class="ghost">Back to full plan</button>
  </section>
</main>

<footer><small>V1 · rule-based, no login, progress stored in this browser (localStorage).</small></footer>
<script src="app.js"></script>
</body>
</html>
